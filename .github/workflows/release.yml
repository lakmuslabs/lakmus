name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - run: make check
      - name: Tag must match the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged="$(uv run python -c 'from importlib.metadata import version; print(version("lakmus"))')"
          if [ "$tag" != "$packaged" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match packaged version ${packaged}" >&2
            exit 1
          fi

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
