name: Bug report
description: Something in the CLI or the engine does not behave as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, what happened instead, and the command you ran.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: >
        The smallest suite and command that shows the problem. A minimal lakmus.yaml and one case
        are worth more than a description. Remove any API key before pasting.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `lakmus --version`, or the commit you are on.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python version.
    validations:
      required: true

  - type: textarea
    id: run
    attributes:
      label: Run file
      description: >
        If the run completed, the relevant part of run.json. It should contain no secret; say so if
        it does, because that is itself the bug.
      render: json
